name: Complete Cart policy

on:
  push:
    branches: [main]
    paths: ['.github/workflows/complete-cart-policy.yml']
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: complete-cart-policy
  cancel-in-progress: false

jobs:
  complete:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout current main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Apply guarded source edits and remove temporary tooling
        shell: powershell
        run: |
          @'
          from pathlib import Path
          path = Path('scripts/finish-cart-policy.py')
          source = path.read_text(encoding='utf-8-sig')
          old = "'Cart/full-farming milestone mail is used.'"
          new = "'use Cart-full / combined DONE milestone mail.'"
          assert source.count(old) == 1, 'Unexpected patch source'
          source = source.replace(old, new)
          anchor = '            var left = Newtonsoft.Json.Linq.JObject.FromObject(before);'
          assert source.count(anchor) == 1, 'Unexpected Mail-only helper'
          source = source.replace(anchor, '''            // An unchanged Apply is an explicit recovery reset, not a Mail edit.
                      if (!before.Accounts.Any(previous => after.Accounts.Any(current => current.Id == previous.Id
                          && current.EffectiveWeightEmailEnabled != previous.EffectiveWeightEmailEnabled))) return false;
          '''.replace('                      ', '            ').replace('                          ', '                ') + anchor)
          exec(compile(source, str(path), 'exec'))
          path = 'Tests/VanillaAutobattleResumeTests.cs'
          text = load(path)
          text = replace(text, '            Test("Settings changes release the verification lease and latch failure", WorkerSettingsChange);', '            Test("Settings changes release the verification lease and latch failure", WorkerSettingsChange);\n            Test("Mail-only edits preserve an active input lease but Cart edits still cancel", WorkerMailSettingsChange);')
          method = '''        private static void WorkerMailSettingsChange()
                  {
                      RuntimeCase((supervisor, runtime) =>
                      {
                          Field(supervisor, "weightMaintenanceGeneration").SetValue(supervisor, 7);
                          var settings = supervisor.Settings;
                          var account = settings.Accounts[0];
                          account.CartMaintenanceEnabled = account.EffectiveCartMaintenanceEnabled;
                          account.WeightEmailEnabled = !account.EffectiveWeightEmailEnabled;
                          account.WeightEnabled = account.EffectiveCartMaintenanceEnabled || account.EffectiveWeightEmailEnabled;
                          supervisor.Apply(settings, false);
                          Assert(!IsCancelled(supervisor, runtime) && RuntimeFlag(runtime, "ScriptRunning")
                              && RuntimeFlag(runtime, "RecoveryOwned") && !RuntimeFlag(runtime, "ResumeVerificationFailed"),
                              "Mail-only edit cancelled or failed an active input worker.");
                          Assert((int)Field(supervisor, "weightMaintenanceGeneration").GetValue(supervisor) == 7,
                              "Mail-only edit invalidated Cart ownership.");
                          var updated = (VanillaReconnectAccount)runtime.GetType().GetField("Account").GetValue(runtime);
                          Assert(updated.EffectiveWeightEmailEnabled == account.EffectiveWeightEmailEnabled,
                              "Mail-only edit was not applied to the live runtime.");
                          settings = supervisor.Settings;
                          settings.Accounts[0].CartMaintenanceEnabled = !settings.Accounts[0].EffectiveCartMaintenanceEnabled;
                          supervisor.Apply(settings, false);
                          Assert(IsCancelled(supervisor, runtime) && !RuntimeFlag(runtime, "RecoveryOwned"),
                              "Cart policy edit failed to cancel the input worker.");
                      });
                  }

          '''
          # Remove the YAML/Python literal alignment, retaining normal C# indentation.
          lines = method.splitlines(True)
          method = lines[0] + ''.join(line[10:] if line.startswith('          ') else line for line in lines[1:])
          text = replace(text, '        private static void WorkerSettingsChange()', method + '        private static void WorkerSettingsChange()')
          save(path, text)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Guarded Cart patch failed; no source commit will be pushed.' }
          git rm scripts/finish-cart-policy.py .github/workflows/complete-cart-policy.yml
          if ($LASTEXITCODE -ne 0) { throw 'Temporary tooling removal failed.' }
          git add AGENTS.md Model/Vanilla/AGENTS.md Model/Vanilla/VanillaMinimalAccountUi.cs Model/Vanilla/VanillaReconnect.cs Model/Vanilla/VanillaWeightAlerts.cs Model/Vanilla/VanillaWeightAlertsPanel.cs Model/Vanilla/VanillaWeightCartAutomation.cs Tests/VanillaMemoryAndWeightTests.cs Tests/VanillaAutobattleResumeTests.cs
          git -c core.whitespace=cr-at-eol diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'Patch whitespace validation failed.' }
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: complete independent Cart and combined-capacity mail policy'
          if ($LASTEXITCODE -ne 0) { throw 'Source commit failed.' }

      - name: Restore NuGet packages
        shell: powershell
        run: |
          nuget restore 4RTools.sln -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw 'NuGet restore failed.' }

      - name: Validate shipped Vanilla build profiles
        shell: powershell
        run: '& .\scripts\validate-vanilla-build-profiles.ps1'

      - name: Build and test Debug
        shell: powershell
        run: '& .\scripts\build.ps1 -Configuration Debug -VanillaRelease'

      - name: Build, test, package and smoke-test Release
        shell: powershell
        run: |
          $text = Get-Content 'Properties/AssemblyInfo.cs' -Raw
          $match = [regex]::Match($text, 'AssemblyFileVersion\("([0-9]+\.[0-9]+\.[0-9]+)\.0"\)')
          if (-not $match.Success) { throw 'Release version is unavailable.' }
          & .\scripts\build-release.ps1 -Version $match.Groups[1].Value

      - name: Native test-owned process recovery checks
        shell: powershell
        run: '& .\scripts\test-recovery-native.ps1'

      - name: Render and validate mock-data UI
        shell: powershell
        run: '& .\scripts\test-ui-layout.ps1'

      - name: Push tested source without rewriting concurrent work
        shell: powershell
        run: |
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw 'Source push failed; preserve evidence and reconcile concurrent work.' }
          $local = (git rev-parse HEAD).Trim()
          $remote = (git ls-remote origin refs/heads/main).Split()[0]
          if ($local -ne $remote) { throw 'Main verification failed.' }
          Write-Host "Verified tested source on main: $local"

      - name: Export validation evidence
        if: always()
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path dist/cart-policy-evidence -Force | Out-Null
          git bundle create dist/cart-policy-evidence/source.bundle --all
          git rev-parse HEAD | Out-File dist/cart-policy-evidence/source-commit.txt -Encoding utf8
          $cache = Join-Path $env:LOCALAPPDATA '4RTools-Engineering'
          foreach ($folder in @('builds', 'portable-tests')) {
            $source = Join-Path $cache $folder
            if (Test-Path $source) { Copy-Item $source dist/cart-policy-evidence -Recurse -Force }
          }

      - name: Upload source, test and UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cart-policy-evidence-${{ github.run_id }}
          path: |
            dist/cart-policy-evidence/**
            dist/ui-layout/*.png
            dist/ui-layout/*.txt
            dist/native-recovery.log
          if-no-files-found: error
          retention-days: 14
