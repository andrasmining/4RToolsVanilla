name: Windows build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: windows-build-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Export exact source evidence
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path dist/source-evidence -Force | Out-Null
          git bundle create dist/source-evidence/source.bundle --all
          if ($LASTEXITCODE -ne 0) { throw 'Source evidence export failed.' }
          git rev-parse HEAD | Out-File dist/source-evidence/source-commit.txt -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Source identity export failed.' }

      - name: Upload source evidence
        uses: actions/upload-artifact@v4
        with:
          name: source-evidence-${{ github.sha }}
          path: dist/source-evidence/*
          if-no-files-found: error
          retention-days: 14

      - name: Restore NuGet packages
        shell: powershell
        run: nuget restore 4RTools.sln -NonInteractive

      - name: Resolve version
        shell: powershell
        run: |
          $text = Get-Content 'Properties/AssemblyInfo.cs' -Raw
          $match = [regex]::Match($text, 'AssemblyFileVersion\("([0-9]+\.[0-9]+\.[0-9]+)\.0"\)')
          if (-not $match.Success) { throw 'Could not resolve semantic version from AssemblyFileVersion.' }
          "VERSION=$($match.Groups[1].Value)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate shipped Vanilla build profiles
        shell: powershell
        run: '& .\scripts\validate-vanilla-build-profiles.ps1'

      - name: Build and test Debug
        shell: powershell
        run: '& .\scripts\build.ps1 -Configuration Debug -VanillaRelease'

      - name: Build, test, package and smoke-test Release
        shell: powershell
        run: '& .\scripts\build-release.ps1 -Version $env:VERSION'

      - name: Native test-owned process recovery checks
        shell: powershell
        run: '& .\scripts\test-recovery-native.ps1'

      - name: Render and validate mock-data UI
        shell: powershell
        run: '& .\scripts\test-ui-layout.ps1'

      - name: Upload UI screenshots and geometry report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-layout-${{ github.sha }}
          path: |
            dist/ui-layout/*.png
            dist/ui-layout/*.txt
            dist/native-recovery.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload portable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: 4RTools-Vanilla-${{ env.VERSION }}-portable
          path: |
            dist/4RTools-Vanilla-v${{ env.VERSION }}-portable.zip
            dist/4RTools-Vanilla-v${{ env.VERSION }}-portable.zip.sha256
          if-no-files-found: error
          retention-days: 30
