name: Complete launcher recovery

on:
  push:
    branches: [chatgpt/launcher-update-recovery]
    paths: ['.github/workflows/complete-launcher-recovery.yml']
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: complete-launcher-recovery
  cancel-in-progress: false

jobs:
  complete:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Integrate guarded edits and remove temporary tooling
        shell: powershell
        run: |
          @'
          import runpy
          scope = runpy.run_path('scripts/complete-launcher-recovery.py')
          edit, rep = scope['edit'], scope['rep']
          edit('Model/Vanilla/VanillaLauncherUpdateRecovery.cs', lambda s: rep(rep(s,
              'Func<bool> cancelled, Action begin)', 'Func<bool> cancelled, System.Action begin)'),
              '            Action check =', '            System.Action check ='))
          edit('Model/Vanilla/VanillaPatcherLauncher.cs', lambda s: rep(s,
              '            return resolved;', '            return Path.GetFullPath(resolved);'))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Guarded launcher integration failed.' }
          git rm scripts/complete-launcher-recovery.py .github/workflows/complete-launcher-recovery.yml
          if ($LASTEXITCODE -ne 0) { throw 'Temporary tooling removal failed.' }
          git add AGENTS.md Model/Vanilla/AGENTS.md Model/Vanilla/VanillaLauncherUpdateRecovery.cs Model/Vanilla/VanillaPatcherLauncher.cs Model/Vanilla/VanillaReconnect.cs Model/Vanilla/VanillaStartupOrchestrator.cs Tests/Program.cs Tests/Vanilla.Diagnostics.Tests.csproj Tests/VanillaNativeRecoveryTests.cs
          git -c core.whitespace=cr-at-eol diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'Patch validation failed.' }
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: recover stalled launcher updates before sequential client restart'
          if ($LASTEXITCODE -ne 0) { throw 'Source commit failed.' }

      - name: Restore NuGet packages
        shell: powershell
        run: |
          nuget restore 4RTools.sln -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw 'NuGet restore failed.' }

      - name: Validate shipped build profiles
        shell: powershell
        run: '& .\scripts\validate-vanilla-build-profiles.ps1'

      - name: Build and test Debug
        shell: powershell
        run: '& .\scripts\build.ps1 -Configuration Debug -VanillaRelease'

      - name: Build, test and package Release
        shell: powershell
        run: '& .\scripts\build-release.ps1 -Version 0.6.66'

      - name: Native process lifecycle checks
        shell: powershell
        run: '& .\scripts\test-recovery-native.ps1'

      - name: Render and validate UI
        shell: powershell
        run: '& .\scripts\test-ui-layout.ps1'

      - name: Integrate tested source without overwriting concurrent work
        shell: powershell
        run: |
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw 'Main advanced or push was denied; preserve evidence for reconciliation.' }
          $local = (git rev-parse HEAD).Trim()
          $remote = (git ls-remote origin refs/heads/main).Split()[0]
          if ($local -ne $remote) { throw 'Remote main verification failed.' }
          Write-Host "Verified tested main: $local"

      - name: Export evidence
        if: always()
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path dist/launcher-evidence -Force | Out-Null
          git bundle create dist/launcher-evidence/source.bundle --all
          git rev-parse HEAD | Out-File dist/launcher-evidence/source-commit.txt -Encoding utf8
          $cache = Join-Path $env:LOCALAPPDATA '4RTools-Engineering'
          foreach ($folder in @('builds', 'portable-tests')) {
            $source = Join-Path $cache $folder
            if (Test-Path $source) { Copy-Item $source dist/launcher-evidence -Recurse -Force }
          }

      - name: Upload source and validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launcher-evidence-${{ github.run_id }}
          path: |
            dist/launcher-evidence/**
            dist/ui-layout/*.png
            dist/ui-layout/*.txt
            dist/native-recovery.log
          if-no-files-found: error
          retention-days: 14
