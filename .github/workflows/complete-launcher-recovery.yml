name: Complete launcher recovery

on:
  push:
    branches: [chatgpt/launcher-update-recovery]
    paths: ['.github/workflows/complete-launcher-recovery.yml']
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: complete-launcher-recovery
  cancel-in-progress: false

jobs:
  complete:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Guard launcher creation and remove temporary tooling
        shell: powershell
        run: |
          @'
          from pathlib import Path
          import difflib
          def rep(s, old, new):
              if s.count(old) != 1: raise RuntimeError('Unexpected source match: ' + old[:120])
              return s.replace(old, new)
          def edit(path, fn):
              p = Path(path)
              raw = p.read_bytes()
              old = raw.decode('utf-8-sig').splitlines(True)
              new = fn(''.join(old).replace('\r\n', '\n')).splitlines(True)
              out = []
              for op, a, b, c, d in difflib.SequenceMatcher(None, [x.rstrip('\r\n') for x in old], [x.rstrip('\r\n') for x in new], autojunk=False).get_opcodes():
                  out.extend(old[a:b] if op == 'equal' else new[c:d])
              p.write_bytes((b'\xef\xbb\xbf' if raw.startswith(b'\xef\xbb\xbf') else b'') + ''.join(out).encode('utf-8'))
          def patcher(s):
              s = rep(s, 'Func<VanillaLauncherUpdateProcess, Func<bool>, bool> recoverUpdate = null)',
                  'Func<VanillaLauncherUpdateProcess, Func<bool>, bool> recoverUpdate = null,\n            Func<Func<Process>, Process> startOwned = null)')
              s = rep(s, 'gameStartX, gameStartY, debugDirectory, attempt == 0 ? recoverUpdate : null);',
                  'gameStartX, gameStartY, debugDirectory, attempt == 0 ? recoverUpdate : null, startOwned);')
              s = rep(s, 'string debugDirectory, Func<VanillaLauncherUpdateProcess, Func<bool>, bool> recoverUpdate)',
                  'string debugDirectory, Func<VanillaLauncherUpdateProcess, Func<bool>, bool> recoverUpdate,\n            Func<Func<Process>, Process> startOwned)')
              return rep(s, '                launched = Process.Start(startInfo);',
                  '                launched = startOwned == null ? Process.Start(startInfo)\n                    : startOwned(() => Process.Start(startInfo));')
          edit('Model/Vanilla/VanillaPatcherLauncher.cs', patcher)
          helper = '''        // STOP/settings and process creation share the same gate. A delayed launcher
                  // restart cannot slip between a cancellation check and Process.Start.
                  private Process RunOwnedLauncherStart(Runtime owner, int generation, Func<bool> cancelled, Func<Process> start)
                  {
                      lock (gate)
                      {
                          Runtime current;
                          if (disposed || cancelled() || generation != Volatile.Read(ref resumeVerificationGeneration)
                              || !runtimes.TryGetValue(owner.Account.Id, out current) || !ReferenceEquals(current, owner)
                              || !current.Account.Enabled || !current.ScriptRunning || !current.RecoveryOwned
                              || current.ResumeOperationGeneration != generation || current.ProcessId.HasValue
                              || OtherRecoveryOwner(owner) != null)
                              throw new OperationCanceledException("Launcher start ownership changed.");
                          return start();
                      }
                  }

          '''
          lines = helper.splitlines(True)
          helper = lines[0] + ''.join(line[10:] if line.startswith('          ') else line for line in lines[1:])
          edit('Model/Vanilla/VanillaLauncherUpdateRecovery.cs', lambda s: rep(s,
              '        private bool launcherUpdateResetRunning;', helper + '        private bool launcherUpdateResetRunning;'))
          edit('Model/Vanilla/VanillaReconnect.cs', lambda s: rep(s,
              '                            launchCancelled, blocked, stillBlocked));',
              '                            launchCancelled, blocked, stillBlocked),\n                        startOwned: start => RunOwnedLauncherStart(runtime, generation, launchCancelled, start));'))
          edit('Model/Vanilla/VanillaStartupOrchestrator.cs', lambda s: rep(s,
              '                        () => StartupCancelled(generation), blocked, stillBlocked));',
              '                        () => StartupCancelled(generation), blocked, stillBlocked),\n                    startOwned: start => RunOwnedLauncherStart(runtime, resumeGeneration,\n                        () => StartupCancelled(generation), start));'))
          def tests(s):
              s = rep(s, '"success", "stop", "generation", "session", "busy", "cooldown"',
                  '"success", "stop", "generation", "session", "busy", "cooldown", "start-stop"')
              old = '                    Assert(!(bool)Get(supervisor, "launcherUpdateResetRunning"));'
              new = '''                    if (mode == "start-stop")
                              {
                                  bool started = false;
                                  Func<System.Diagnostics.Process> start = () => { started = true; return null; };
                                  Call(supervisor, "RunOwnedLauncherStart", owner, 7, (Func<bool>)(() => false), start);
                                  Assert(started);
                                  started = false;
                                  Set(owner, "ProcessId", (int?)99);
                                  Throws<OperationCanceledException>(() => Call(supervisor, "RunOwnedLauncherStart", owner, 7, (Func<bool>)(() => false), start));
                                  Assert(!started);
                                  Set(owner, "ProcessId", null);
                                  supervisor.Stop();
                                  Throws<OperationCanceledException>(() => Call(supervisor, "RunOwnedLauncherStart", owner, 7, (Func<bool>)(() => false), start));
                                  Assert(!started);
                              }
          '''
              lines = new.splitlines(True)
              new = lines[0] + ''.join(line[10:] if line.startswith('          ') else line for line in lines[1:])
              return rep(s, old, new + old)
          edit('Tests/VanillaLauncherUpdateTests.cs', tests)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Launcher start guard integration failed.' }
          git rm .github/workflows/complete-launcher-recovery.yml
          if ($LASTEXITCODE -ne 0) { throw 'Temporary workflow removal failed.' }
          git add Model/Vanilla/VanillaLauncherUpdateRecovery.cs Model/Vanilla/VanillaPatcherLauncher.cs Model/Vanilla/VanillaReconnect.cs Model/Vanilla/VanillaStartupOrchestrator.cs Tests/VanillaLauncherUpdateTests.cs
          git -c core.whitespace=cr-at-eol diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'Patch validation failed.' }
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: bind launcher creation atomically to recovery ownership and STOP'
          if ($LASTEXITCODE -ne 0) { throw 'Source commit failed.' }

      - name: Restore NuGet packages
        shell: powershell
        run: |
          nuget restore 4RTools.sln -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw 'NuGet restore failed.' }

      - name: Validate shipped build profiles
        shell: powershell
        run: '& .\scripts\validate-vanilla-build-profiles.ps1'

      - name: Build and test Debug
        shell: powershell
        run: '& .\scripts\build.ps1 -Configuration Debug -VanillaRelease'

      - name: Build, test and package Release
        shell: powershell
        run: '& .\scripts\build-release.ps1 -Version 0.6.66'

      - name: Native process lifecycle checks
        shell: powershell
        run: '& .\scripts\test-recovery-native.ps1'

      - name: Render and validate UI
        shell: powershell
        run: '& .\scripts\test-ui-layout.ps1'

      - name: Integrate tested source without overwriting concurrent work
        shell: powershell
        run: |
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw 'Main advanced or push was denied; preserve evidence for reconciliation.' }
          $local = (git rev-parse HEAD).Trim()
          $remote = (git ls-remote origin refs/heads/main).Split()[0]
          if ($local -ne $remote) { throw 'Remote main verification failed.' }
          Write-Host "Verified tested main: $local"

      - name: Export evidence
        if: always()
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path dist/launcher-evidence -Force | Out-Null
          git bundle create dist/launcher-evidence/source.bundle --all
          git rev-parse HEAD | Out-File dist/launcher-evidence/source-commit.txt -Encoding utf8
          $cache = Join-Path $env:LOCALAPPDATA '4RTools-Engineering'
          foreach ($folder in @('builds', 'portable-tests')) {
            $source = Join-Path $cache $folder
            if (Test-Path $source) { Copy-Item $source dist/launcher-evidence -Recurse -Force }
          }

      - name: Upload source and validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launcher-evidence-${{ github.run_id }}
          path: |
            dist/launcher-evidence/**
            dist/ui-layout/*.png
            dist/ui-layout/*.txt
            dist/native-recovery.log
          if-no-files-found: error
          retention-days: 14
